<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jack's Checking — Accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --deep-green: #61b127;
    --mid-green: #146C43;
    --accent-green: #1E8E5A;
    --pale-green: #EAF5EE;
    --debit-red: #B3261E;
    --credit-green: #1E7A45;
    --ink: #1B1F1D;
    --muted: #6B7570;
    --hairline: #E4E8E5;
    --surface: #FFFFFF;
    --page-bg: #EEF2EF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--page-bg);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    color: var(--ink);
  }

  .screen {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 40px -20px rgba(11, 61, 46, 0.35);
  }

  /* Header */
  .header {
    background: var(--deep-green);
    color: #fff;
    padding: 18px 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header .back {
    font-size: 22px;
    width: 28px;
    line-height: 1;
    cursor: pointer;
  }

  .header .title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .header .done {
    font-size: 14px;
    font-weight: 500;
    color: #BFE8CF;
    cursor: pointer;
  }

  /* Section heading */
  .section-heading {
    padding: 16px 20px 6px;
    font-size: 12px;
    color: var(--muted);
    background: #FAFBFA;
  }

  /* Account rows */
  .account-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--hairline);
    gap: 12px;
  }

  .account-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .account-name {
    font-size: 15px;
    font-weight: 500;
  }

  .account-number {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--muted);
  }

  .account-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .balance {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    color: var(--ink);
  }

  .balance.negative { color: var(--debit-red); }

  .account-row.has-button {
    align-items: flex-start;
  }

  .pay-btn {
    margin-top: 8px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    background: var(--deep-green);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    align-self: flex-start;
  }

  .pay-btn:hover {
    background: var(--accent-green);
  }

  .chevron {
    color: #C7CDC9;
    font-size: 14px;
  }

  .footer-note {
    padding: 16px 20px 22px;
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="screen">
    <div class="header">
      <span class="back">‹</span>
      <span class="title">Accounts</span>
      <span class="done">Done</span>
    </div>

    <div class="section-heading">MY ACCOUNTS</div>

    <div class="account-row">
      <div class="account-left">
        <span class="account-name">Checking</span>
        <span class="account-number">*******7986</span>
      </div>
      <div class="account-right">
        <span class="balance">$4,382.98</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="account-row">
      <div class="account-left">
        <span class="account-name">Jack Savings</span>
        <span class="account-number">*******3124</span>
      </div>
      <div class="account-right">
        <span class="balance">$20,145.80</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="account-row has-button">
      <div class="account-left">
        <span class="account-name">Cashback Credit Card</span>
        <span class="account-number">************1098</span>
        <button class="pay-btn" type="button">Make a Payment</button>
      </div>
      <div class="account-right">
        <span class="balance negative">($2,109.21)</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="footer-note">
      Huntington Bank
    </div>
  </div>

</body>
</html>
