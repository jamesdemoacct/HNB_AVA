<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jack's Checking — Account Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --deep-green: #0B3D2E;
    --mid-green: #146C43;
    --accent-green: #1E8E5A;
    --pale-green: #EAF5EE;
    --debit-red: #B3261E;
    --credit-green: #1E7A45;
    --ink: #1B1F1D;
    --muted: #6B7570;
    --hairline: #E4E8E5;
    --surface: #FFFFFF;
    --page-bg: #EEF2EF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--page-bg);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    color: var(--ink);
  }

  .screen {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 40px -20px rgba(11, 61, 46, 0.35);
  }

  /* Header */
  .header {
    background: var(--deep-green);
    color: #fff;
    padding: 18px 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header .back {
    font-size: 22px;
    width: 28px;
    line-height: 1;
    cursor: pointer;
  }

  .header .title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .header .done {
    font-size: 14px;
    font-weight: 500;
    color: #BFE8CF;
    cursor: pointer;
  }

  /* Balance */
  .balance-block {
    padding: 22px 20px 18px;
    text-align: center;
    border-bottom: 1px solid var(--hairline);
  }

  .balance-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .balance-amount {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .balance-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    padding: 14px 16px 0;
    gap: 8px;
    border-bottom: 1px solid var(--hairline);
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0 12px;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    border-radius: 8px 8px 0 0;
    cursor: pointer;
  }

  .tab.active {
    color: var(--deep-green);
    font-weight: 600;
    background: var(--pale-green);
    border-bottom: 2px solid var(--accent-green);
  }

  /* Search row */
  .search-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 20px;
    color: var(--mid-green);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .search-row svg { flex-shrink: 0; }

  /* Transaction list */
  .date-heading {
    padding: 4px 20px 6px;
    font-size: 12px;
    color: var(--muted);
    background: #FAFBFA;
  }

  .txn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--hairline);
    gap: 12px;
  }

  .txn-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .merchant {
    font-size: 15px;
    font-weight: 500;
  }

  .status-tag {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  .txn-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .amount {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
  }

  .amount.debit { color: var(--debit-red); }
  .amount.declined { color: var(--muted); text-decoration: line-through; }

  .chevron {
    color: #C7CDC9;
    font-size: 14px;
  }

  .txn.declined-row .merchant { color: var(--muted); }

  .footer-note {
    padding: 16px 20px 22px;
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="screen">
    <div class="header">
      <span class="back">‹</span>
      <span class="title">Jack's Checking</span>
      <span class="done">Done</span>
    </div>

    <div class="balance-block">
      <div class="balance-label">Available balance</div>
      <div class="balance-amount">$2,458.41</div>
      <div class="balance-sub">As of September 16, 2026</div>
    </div>

    <div class="tabs">
      <div class="tab">Summary</div>
      <div class="tab">Insights</div>
      <div class="tab active">Activity</div>
    </div>

    <div class="search-row">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      SEARCH
    </div>

    <div class="date-heading">9/16/2026</div>

    <div class="txn">
      <div class="txn-left">
        <span class="merchant">Amazon</span>
      </div>
      <div class="txn-right">
        <span class="amount debit">-$23.19</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="txn">
      <div class="txn-left">
        <span class="merchant">Panera Bread</span>
      </div>
      <div class="txn-right">
        <span class="amount debit">-$18.40</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="txn declined-row">
      <div class="txn-left">
        <span class="merchant">Best Buy</span>
        <span class="status-tag">Declined</span>
      </div>
      <div class="txn-right">
        <span class="amount declined">-$193.49</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="footer-note">
      Huntington Bank
    </div>
  </div>

</body>
</html>
